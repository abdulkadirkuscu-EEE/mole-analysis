<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Ben Analiz</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg: #0a0e17; --card: #131a2b; --card2: #1a2236;
  --accent: #00d4aa; --accent2: #0099ff; --danger: #ff4466;
  --text: #e8edf5; --text2: #8892a8; --border: #1e2a42;
  --radius: 14px;
}
body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; overflow-x: hidden;
}
.container { max-width: 480px; margin: 0 auto; padding: 16px; }

/* Header */
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 0 20px; border-bottom: 1px solid var(--border); margin-bottom: 20px;
}
.header h1 { font-size: 22px; font-weight: 700; }
.header h1 span { color: var(--accent); }
.header-back { background: none; border: none; color: var(--text2); font-size: 24px; cursor: pointer; padding: 4px 8px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 14px 24px; border-radius: var(--radius); border: none;
  font-family: inherit; font-size: 15px; font-weight: 600;
  cursor: pointer; transition: all 0.2s; width: 100%;
}
.btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
.btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
.btn-secondary { background: var(--card2); color: var(--text); border: 1px solid var(--border); }
.btn-danger { background: var(--danger); color: #fff; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-sm { padding: 10px 16px; font-size: 13px; width: auto; }

/* Cards */
.card {
  background: var(--card); border-radius: var(--radius); padding: 18px;
  border: 1px solid var(--border); margin-bottom: 12px;
  cursor: pointer; transition: all 0.2s;
}
.card:hover { border-color: var(--accent); transform: translateY(-1px); }
.card-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
.card-sub { font-size: 13px; color: var(--text2); }

/* Input */
.input-group { margin-bottom: 16px; }
.input-group label { display: block; font-size: 13px; color: var(--text2); margin-bottom: 6px; font-weight: 500; }
.input {
  width: 100%; padding: 14px; background: var(--card2); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--text); font-family: inherit; font-size: 15px;
  outline: none; transition: border-color 0.2s;
}
.input:focus { border-color: var(--accent); }

/* Camera */
.camera-wrap {
  position: relative; width: 100%; height: 50vh; border-radius: var(--radius);
  overflow: hidden; background: #000; margin: 0 auto 8px;
}
.camera-wrap video, .camera-wrap img { width: 100%; height: 100%; object-fit: cover; }
.camera-bottom {
  display: flex; justify-content: center; padding: 10px 0;
}
.camera-btn {
  width: 74px; height: 74px; border-radius: 50%; border: 5px solid #fff;
  background: rgba(255,255,255,0.2); cursor: pointer; transition: all 0.15s;
}
.camera-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.5); }

/* Zoom buttons */
.zoom-btn {
  padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border);
  background: var(--card); color: var(--text2); font-family: inherit;
  font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s;
}
.zoom-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

.camera-controls {
  display: flex; flex-direction: column; gap: 8px; align-items: center;
}

/* Results */
.result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.result-item {
  background: var(--card); border-radius: 10px; overflow: hidden;
  border: 1px solid var(--border);
}
.result-item img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
.result-item .label { padding: 8px; font-size: 11px; color: var(--text2); text-align: center; font-weight: 500; }

/* Comparison result */
.comp-result {
  background: var(--card); border-radius: var(--radius); padding: 18px;
  border: 1px solid var(--border); margin-bottom: 12px;
}
.comp-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); }
.comp-row:last-child { border: none; }
.comp-label { color: var(--text2); font-size: 13px; }
.comp-value { font-weight: 600; font-size: 14px; }
.status-ok { color: var(--accent); }
.status-warn { color: var(--danger); }

/* Loading */
.loading { text-align: center; padding: 40px; }
.spinner {
  width: 36px; height: 36px; border: 3px solid var(--border);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin 0.8s linear infinite; margin: 0 auto 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { color: var(--text2); font-size: 14px; }

/* Empty state */
.empty { text-align: center; padding: 60px 20px; }
.empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-text { color: var(--text2); font-size: 14px; margin-bottom: 20px; }

/* Select list for compare */
.select-item {
  background: var(--card); border-radius: 10px; padding: 14px;
  border: 2px solid var(--border); margin-bottom: 8px; cursor: pointer;
  transition: all 0.2s; font-size: 14px;
}
.select-item.selected { border-color: var(--accent); background: var(--card2); }
.select-item .time { color: var(--text2); font-size: 12px; }

/* Comparison image */
.comp-image { width: 100%; border-radius: 10px; margin-bottom: 16px; }

/* Fullscreen image */
.fullscreen {
  position: fixed; top:0; left:0; width:100%; height:100%;
  background: rgba(0,0,0,0.95); z-index: 1000; display: flex;
  align-items: center; justify-content: center; cursor: pointer;
}
.fullscreen img { max-width: 95%; max-height: 95%; object-fit: contain; }

/* Icon button (delete etc) */
.btn-icon {
  background: none; border: none; font-size: 18px; cursor: pointer;
  padding: 8px; border-radius: 8px; transition: background 0.2s;
}
.btn-icon:hover { background: rgba(255,68,102,0.15); }

/* RGB table */
.rgb-header, .rgb-row {
  display: flex; align-items: center; gap: 4px; padding: 4px 0;
  font-size: 11px; font-family: 'Courier New', monospace;
}
.rgb-header { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; color: var(--text2); border-bottom: 1px solid var(--border); margin-bottom: 2px; font-size: 12px; }
.rgb-label { width: 28px; color: var(--text2); font-weight: 600; flex-shrink: 0; }
.rgb-val { flex: 1; text-align: center; font-size: 10px; }
.rgb-divider { color: var(--border); flex-shrink: 0; width: 10px; text-align: center; }
.rgb-de { width: 50px; text-align: right; color: var(--text2); font-size: 10px; flex-shrink: 0; }
</style>
</head>
<body>
<div class="container" id="app"></div>

<script>
// ─── CONFIG ───
const API = window.location.origin;

// ─── STATE ───
let state = { screen: 'home', moles: [], currentMole: null, captures: [], selectedRef: null, selectedTest: null };

// ─── API CALLS ───
async function apiGet(path) {
  const r = await fetch(API + path);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function apiPost(path, formData) {
  const r = await fetch(API + path, { method: 'POST', body: formData });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

// ─── SCREENS ───
function render() {
  const app = document.getElementById('app');
  switch(state.screen) {
    case 'home': renderHome(app); break;
    case 'newMole': renderNewMole(app); break;
    case 'moleDetail': renderMoleDetail(app); break;
    case 'camera': renderCamera(app); break;
    case 'analyzing': renderAnalyzing(app); break;
    case 'results': renderResults(app); break;
    case 'compare': renderCompare(app); break;
    case 'compareResult': renderCompareResult(app); break;
  }
}

// HOME
async function renderHome(app) {
  app.innerHTML = `
    <div class="header">
      <h1>🔬 Ben <span>Analiz</span></h1>
    </div>
    <div class="loading"><div class="spinner"></div><div class="loading-text">Yükleniyor...</div></div>
  `;
  try {
    const data = await apiGet('/moles');
    state.moles = data.moles;
    let html = `
      <div class="header">
        <h1>🔬 Ben <span>Analiz</span></h1>
      </div>
    `;
    if (state.moles.length === 0) {
      html += `
        <div class="empty">
          <div class="empty-icon">📷</div>
          <div class="empty-text">Henüz kayıtlı ben yok.<br>İlk benini ekleyerek başla.</div>
        </div>
      `;
    } else {
      state.moles.forEach(m => {
        html += `
          <div class="card" style="display:flex;align-items:center;justify-content:space-between">
            <div onclick="openMole('${m.name}')" style="flex:1">
              <div class="card-title">${m.name}</div>
              <div class="card-sub">${m.capture_count} çekim</div>
            </div>
            <button class="btn-icon" onclick="event.stopPropagation();deleteMole('${m.name}')" title="Sil">🗑️</button>
          </div>
        `;
      });
    }
    html += `<button class="btn btn-primary" onclick="goScreen('newMole')" style="margin-top:12px">+ Yeni Ben Ekle</button>`;
    app.innerHTML = html;
  } catch(e) {
    app.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">API bağlantı hatası<br>${e.message}</div></div>`;
  }
}

// NEW MOLE
function renderNewMole(app) {
  app.innerHTML = `
    <div class="header">
      <button class="header-back" onclick="goScreen('home')">←</button>
      <h1>Yeni Ben</h1>
      <div></div>
    </div>
    <div class="input-group">
      <label>Ben Adı</label>
      <input class="input" id="moleName" placeholder="Örn: BEN-1, Sol Kol, Sırt" autofocus>
    </div>
    <button class="btn btn-primary" onclick="createMole()">Oluştur ve Fotoğraf Çek</button>
  `;
}

function createMole() {
  const name = document.getElementById('moleName').value.trim();
  if (!name) return alert('Ben adı girin');
  state.currentMole = name;
  goScreen('camera');
}

// MOLE DETAIL
async function renderMoleDetail(app) {
  app.innerHTML = `
    <div class="header">
      <button class="header-back" onclick="goScreen('home')">←</button>
      <h1>${state.currentMole}</h1>
      <div></div>
    </div>
    <div class="loading"><div class="spinner"></div><div class="loading-text">Çekimler yükleniyor...</div></div>
  `;
  try {
    const data = await apiGet(`/moles/${state.currentMole}/captures`);
    state.captures = data.captures;
    let html = `
      <div class="header">
        <button class="header-back" onclick="goScreen('home')">←</button>
        <h1>${state.currentMole}</h1>
        <div></div>
      </div>
    `;
    if (state.captures.length === 0) {
      html += `<div class="empty"><div class="empty-icon">📸</div><div class="empty-text">Henüz çekim yok.</div></div>`;
    } else {
      state.captures.forEach(c => {
        const date = c.timestamp.replace(/_/g, ' ').replace(/-/g, '.').slice(0,16);
        html += `
          <div class="card" style="display:flex;align-items:center;justify-content:space-between">
            <div onclick="viewCapture('${c.timestamp}')" style="flex:1">
              <div class="card-title">${date}</div>
              <div class="card-sub">${c.analyzed ? '✓ Analiz tamamlandı' : 'İşleniyor...'}</div>
            </div>
            <button class="btn-icon" onclick="event.stopPropagation();deleteCapture('${c.timestamp}')" title="Sil">🗑️</button>
          </div>
        `;
      });
    }
    html += `
      <button class="btn btn-primary" onclick="goScreen('camera')" style="margin-top:12px">📷 Yeni Çekim</button>
      ${state.captures.length >= 2 ? `<button class="btn btn-secondary" onclick="goScreen('compare')" style="margin-top:8px">🔄 Karşılaştır</button>` : ''}
      <button class="btn btn-secondary" onclick="renameMole()" style="margin-top:8px">✏️ Yeniden Adlandır</button>
    `;
    app.innerHTML = html;
  } catch(e) {
    app.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">${e.message}</div></div>`;
  }
}

// CAMERA
function renderCamera(app) {
  app.innerHTML = `
    <div class="header">
      <button class="header-back" onclick="stopCamera(); goScreen(state.captures ? 'moleDetail' : 'home')">←</button>
      <h1>${state.currentMole}</h1>
      <div></div>
    </div>
    <div class="camera-wrap" id="cameraWrap">
      <video id="camVideo" autoplay playsinline></video>
    </div>
    <div class="camera-controls">
      <div style="display:flex; justify-content:center; gap:10px;">
        <button class="zoom-btn" onclick="setZoom(1)" id="z1">1x</button>
        <button class="zoom-btn" onclick="setZoom(2)" id="z2">2x</button>
        <button class="zoom-btn" onclick="setZoom(3)" id="z3">3x</button>
      </div>
      <p style="text-align:center; color:#FF4466; font-size:12px; font-weight:700; margin:0">PHANTOM KARTINI ÇERÇEVE İÇİNE AL VE ÇEK</p>
      <label class="btn btn-secondary" style="cursor:pointer; width:100%">
        🖼️ Galeriden Seç
        <input type="file" accept="image/*" onchange="fileSelected(event)" style="display:none">
      </label>
      <div class="camera-bottom">
        <button class="camera-btn" onclick="capturePhoto()"></button>
      </div>
    </div>
  `;
  startCamera();
}

let camStream = null;
let currentZoom = 1;

async function startCamera() {
  try {
    camStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1920 } }
    });
    document.getElementById('camVideo').srcObject = camStream;
    currentZoom = 1;
    updateZoomButtons(1);
  } catch(e) {
    const wrap = document.querySelector('.camera-wrap');
    wrap.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:12px;padding:20px">
        <div style="font-size:36px">📷</div>
        <div style="color:var(--text2);font-size:13px;text-align:center">Kamera erişimi yok.<br>Aşağıdan galeriden fotoğraf seçebilirsin.</div>
      </div>
    `;
  }
}

function setZoom(level) {
  if (!camStream) return;
  const track = camStream.getVideoTracks()[0];
  const caps = track.getCapabilities ? track.getCapabilities() : {};
  if (caps.zoom) {
    const maxZoom = caps.zoom.max || 10;
    const minZoom = caps.zoom.min || 1;
    const clampedZoom = Math.min(Math.max(level, minZoom), maxZoom);
    track.applyConstraints({ advanced: [{ zoom: clampedZoom }] });
    currentZoom = clampedZoom;
  }
  // Zoom sonrası otomatik netleme
  if (caps.focusMode) {
    track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] })
      .then(() => {
        setTimeout(() => {
          track.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] }).catch(() => {});
        }, 300);
      }).catch(() => {});
  }
  updateZoomButtons(level);
}

function updateZoomButtons(level) {
  document.querySelectorAll('.zoom-btn').forEach(btn => {
    btn.classList.remove('active');
    if (btn.textContent === level + 'x') btn.classList.add('active');
  });
}

function stopCamera() {
  if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
}

function capturePhoto() {
  const video = document.getElementById('camVideo');
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  stopCamera();
  canvas.toBlob(blob => uploadPhoto(blob), 'image/jpeg', 0.92);
}

function fileSelected(e) {
  const file = e.target.files[0];
  if (file) { stopCamera(); uploadPhoto(file); }
}

async function uploadPhoto(blob) {
  state.screen = 'analyzing';
  render();
  const fd = new FormData();
  fd.append('mole_name', state.currentMole);
  fd.append('photo', blob, 'photo.jpg');
  try {
    const r = await fetch(API + '/analyze', { method: 'POST', body: fd });
    if (!r.ok) {
      const err = await r.json();
      const msg = err.detail || 'Bilinmeyen hata';
      showError(msg);
      return;
    }
    const data = await r.json();
    state.lastResult = data;
    state.lastTimestamp = data.timestamp;
    goScreen('results');
  } catch(e) {
    showError('Bağlantı hatası: ' + e.message);
  }
}

function showError(msg) {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="header"><div></div><h1>⚠️ Hata</h1><div></div></div>
    <div style="background:var(--card);border:1px solid var(--danger);border-radius:var(--radius);padding:20px;margin-bottom:16px">
      <div style="color:var(--danger);font-weight:600;margin-bottom:8px">Çekim Başarısız</div>
      <div style="color:var(--text2);font-size:14px;line-height:1.5">${msg}</div>
    </div>
    <button class="btn btn-primary" onclick="goScreen('camera')">🔄 Tekrar Çek</button>
    <button class="btn btn-secondary" onclick="goScreen('moleDetail')" style="margin-top:8px">← Geri</button>
  `;
}

// ANALYZING
function renderAnalyzing(app) {
  app.innerHTML = `
    <div class="header"><div></div><h1>${state.currentMole}</h1><div></div></div>
    <div class="loading" style="padding:80px 20px">
      <div class="spinner"></div>
      <div class="loading-text">Analiz ediliyor...</div>
      <div style="color:var(--text2);font-size:12px;margin-top:8px">Step 1-3: Tespit, perspektif, yamalar</div>
    </div>
  `;
}

// RESULTS
function renderResults(app) {
  const ts = state.lastTimestamp;
  const m = state.currentMole;
  const steps = [
    { file: 'input.jpg', label: 'Orijinal' },
    { file: 'bw.png', label: 'Siyah/Beyaz' },
    { file: 'output.jpg', label: 'Bbox Tespit' },
    { file: 'crop.jpg', label: 'Kırpılmış' },
    { file: 'perspective.jpg', label: 'Perspektif' },
    { file: 'color_square.jpg', label: 'Renk Yamaları' },
  ];
  let html = `
    <div class="header">
      <button class="header-back" onclick="goScreen('moleDetail')">←</button>
      <h1>Sonuçlar</h1>
      <div></div>
    </div>
    <div style="margin-bottom:12px">
      <div style="color:var(--accent);font-size:13px;font-weight:600">✓ ${state.lastResult.patch_count} yama tespit edildi</div>
      <div style="color:var(--text2);font-size:12px">${ts.replace(/_/g, ' ')}</div>
    </div>
    <div class="result-grid">
  `;
  steps.forEach(s => {
    const url = `${API}/image/${m}/${ts}/${s.file}`;
    html += `
      <div class="result-item" onclick="showFull('${url}')">
        <img src="${url}" loading="lazy">
        <div class="label">${s.label}</div>
      </div>
    `;
  });
  html += `</div>
    <button class="btn btn-primary" onclick="goScreen('moleDetail')" style="margin-bottom:8px">✅ DOĞRU ÇEKİM</button>
    <button class="btn btn-danger" onclick="rejectCapture()" style="margin-bottom:16px">❌ HATALI ÇEKİM — TEKRAR ÇEK</button>
  `;
  app.innerHTML = html;
}

// COMPARE - SELECT
function renderCompare(app) {
  let html = `
    <div class="header">
      <button class="header-back" onclick="goScreen('moleDetail')">←</button>
      <h1>Karşılaştır</h1>
      <div></div>
    </div>
    <div class="input-group"><label>Referans Çekim (eski)</label></div>
  `;
  state.captures.forEach(c => {
    const sel = state.selectedRef === c.timestamp ? 'selected' : '';
    const date = c.timestamp.replace(/_/g, ' ').replace(/-/g, '.').slice(0,16);
    html += `<div class="select-item ${sel}" onclick="selectRef('${c.timestamp}')">${date}</div>`;
  });
  html += `<div class="input-group" style="margin-top:16px"><label>Test Çekim (yeni)</label></div>`;
  state.captures.forEach(c => {
    const sel = state.selectedTest === c.timestamp ? 'selected' : '';
    const date = c.timestamp.replace(/_/g, ' ').replace(/-/g, '.').slice(0,16);
    html += `<div class="select-item ${sel}" onclick="selectTest('${c.timestamp}')">${date}</div>`;
  });
  const canCompare = state.selectedRef && state.selectedTest && state.selectedRef !== state.selectedTest;
  html += `<button class="btn btn-primary" style="margin-top:16px" ${canCompare ? '' : 'disabled'} onclick="runCompare()">🔬 Karşılaştır</button>`;
  app.innerHTML = html;
}

function selectRef(ts) { state.selectedRef = ts; render(); }
function selectTest(ts) { state.selectedTest = ts; render(); }

async function runCompare() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="header"><div></div><h1>Karşılaştırma</h1><div></div></div>
    <div class="loading" style="padding:80px 20px">
      <div class="spinner"></div>
      <div class="loading-text">Step 4-8 çalışıyor...</div>
      <div style="color:var(--text2);font-size:12px;margin-top:8px">Kalibrasyon, renk ve boyut analizi</div>
    </div>
  `;
  const fd = new FormData();
  fd.append('mole_name', state.currentMole);
  fd.append('ref_timestamp', state.selectedRef);
  fd.append('test_timestamp', state.selectedTest);
  try {
    state.compResult = await apiPost('/compare', fd);
    goScreen('compareResult');
  } catch(e) {
    alert('Hata: ' + e.message);
    goScreen('compare');
  }
}

// COMPARE RESULT
function renderCompareResult(app) {
  const r = state.compResult;
  const colorOk = !r.step6_color.changed;
  const sizeOk = !r.step8_size.changed;
  const m = state.currentMole;
  const compImg = `${API}/image/${m}/${state.selectedTest}/comparison.jpg`;
  const refColorImg = `${API}/image/${m}/${state.selectedRef}/color_square.jpg`;
  const testColorImg = `${API}/image/${m}/${state.selectedTest}/color_square.jpg`;
  const step7Img = `${API}/image/${m}/${state.selectedTest}/step7_scale.jpg`;
  const step8Img = `${API}/image/${m}/${state.selectedTest}/step8_size.jpg`;

  const labels = ["Ü1","Ü2","Ü3","Ü4","A1","A2","A3","A4","S1","S2","S3","S4","Sa1","Sa2","Sa3","Sa4"];

  // RGB tablosu oluştur
  let rgbRows = '';
  const pRef = r.patch_rgbs_ref || [];
  const pTest = r.patch_rgbs_test || [];
  for (let i = 0; i < Math.min(pRef.length, pTest.length); i++) {
    const rr = pRef[i], rt = pTest[i];
    const de = Math.sqrt(Math.pow(rt[0]-rr[0],2)+Math.pow(rt[1]-rr[1],2)+Math.pow(rt[2]-rr[2],2)).toFixed(1);
    rgbRows += `
      <div class="rgb-row">
        <span class="rgb-label">${labels[i] || i+1}</span>
        <span class="rgb-val" style="color:rgb(${Math.round(rr[0])},${Math.round(rr[1])},${Math.round(rr[2])})">(${Math.round(rr[0])},${Math.round(rr[1])},${Math.round(rr[2])})</span>
        <span class="rgb-divider">│</span>
        <span class="rgb-val" style="color:rgb(${Math.round(rt[0])},${Math.round(rt[1])},${Math.round(rt[2])})">(${Math.round(rt[0])},${Math.round(rt[1])},${Math.round(rt[2])})</span>
        <span class="rgb-de">ΔE ${de}</span>
      </div>
    `;
  }

  app.innerHTML = `
    <div class="header">
      <button class="header-back" onclick="goScreen('moleDetail')">←</button>
      <h1>Sonuç</h1>
      <div></div>
    </div>

    <!-- Referans | Test | Kalibre -->
    <div style="color:var(--text2);font-size:12px;font-weight:600;margin-bottom:6px">REFERANS → TEST → KALİBRE</div>
    <img class="comp-image" src="${compImg}" onclick="showFull('${compImg}')">

    <!-- Renk yama görüntüleri yan yana -->
    <div style="color:var(--text2);font-size:12px;font-weight:600;margin-bottom:6px;margin-top:20px">RENK YAMALARI DETAY</div>
    <div style="display:flex;gap:8px;margin-bottom:20px">
      <div style="flex:1;text-align:center">
        <img src="${refColorImg}" onclick="showFull('${refColorImg}')" style="width:100%;border-radius:10px;border:1px solid var(--border)">
        <div style="color:var(--accent);font-size:11px;margin-top:4px;font-weight:600">REFERANS</div>
      </div>
      <div style="flex:1;text-align:center">
        <img src="${testColorImg}" onclick="showFull('${testColorImg}')" style="width:100%;border-radius:10px;border:1px solid var(--border)">
        <div style="color:#ffaa00;font-size:11px;margin-top:4px;font-weight:600">TEST</div>
      </div>
    </div>

    <!-- Yama RGB değerleri tablosu -->
    <div class="comp-result">
      <div style="font-weight:600;margin-bottom:10px">Yama RGB Değerleri</div>
      <div class="rgb-header">
        <span class="rgb-label">#</span>
        <span class="rgb-val" style="color:var(--accent)">Referans</span>
        <span class="rgb-divider"></span>
        <span class="rgb-val" style="color:#ffaa00">Test</span>
        <span class="rgb-de">ΔE</span>
      </div>
      ${rgbRows}
      <div class="rgb-row" style="border-top:1px solid var(--accent);margin-top:4px;padding-top:8px">
        <span class="rgb-label" style="font-weight:700">ORT</span>
        <span class="rgb-val"></span>
        <span class="rgb-divider"></span>
        <span class="rgb-val"></span>
        <span class="rgb-de" style="font-weight:700">ΔE ${r.step4_mean_drift}</span>
      </div>
    </div>

    <!-- Step 6: Color Analysis -->
    <div class="comp-result">
      <div style="font-weight:600;margin-bottom:10px">🎨 Color Analysis — Renk Değişimi</div>
      <div class="comp-row">
        <span class="comp-label">Referans Ben RGB</span>
        <span class="comp-value">(${r.step6_color.ref_rgb.map(v=>Math.round(v)).join(', ')})</span>
      </div>
      <div class="comp-row">
        <span class="comp-label">Test Ben RGB (kalibre)</span>
        <span class="comp-value">(${r.step6_color.test_calibrated_rgb.map(v=>Math.round(v)).join(', ')})</span>
      </div>
      <div class="comp-row">
        <span class="comp-label">Kalibre ΔE</span>
        <span class="comp-value">${r.step6_color.de_calibrated}</span>
      </div>
      <div class="comp-row">
        <span class="comp-label">Eşik</span>
        <span class="comp-value">${r.step6_color.threshold}</span>
      </div>
      <div class="comp-row">
        <span class="comp-label">Durum</span>
        <span class="comp-value ${colorOk ? 'status-ok' : 'status-warn'}">${colorOk ? '✓ Değişmemiş' : '⚠️ Değişmiş'}</span>
      </div>
    </div>

    <!-- Step 7 Görsel: Ölçek karşılaştırma -->
    <div style="color:var(--text2);font-size:12px;font-weight:600;margin-bottom:6px;margin-top:16px">ÖLÇEK KARŞILAŞTIRMASI</div>
    <img class="comp-image" src="${step7Img}" onclick="showFull('${step7Img}')" style="margin-bottom:16px">

    <!-- Step 7-8: Size Analysis -->
    <div class="comp-result">
      <div style="font-weight:600;margin-bottom:10px">📐 Size Analysis — Boyut Değişimi</div>
      <div class="comp-row">
        <span class="comp-label">Ölçek Faktörü</span>
        <span class="comp-value">${r.step7_scale.factor}</span>
      </div>
      <div class="comp-row">
        <span class="comp-label">Referans Alan</span>
        <span class="comp-value">${r.step8_size.ref_area} px²</span>
      </div>
      <div class="comp-row">
        <span class="comp-label">Test Alan (kalibre)</span>
        <span class="comp-value">${r.step8_size.test_area_calibrated} px²</span>
      </div>
      <div class="comp-row">
        <span class="comp-label">Alan Değişimi</span>
        <span class="comp-value">${r.step8_size.area_change_pct}%</span>
      </div>
      <div class="comp-row">
        <span class="comp-label">Çap Değişimi</span>
        <span class="comp-value">${r.step8_size.diam_change_pct}%</span>
      </div>
      <div class="comp-row">
        <span class="comp-label">Durum</span>
        <span class="comp-value ${sizeOk ? 'status-ok' : 'status-warn'}">${sizeOk ? '✓ Değişmemiş' : '⚠️ Değişmiş'}</span>
      </div>
    </div>

    <!-- Step 8 Görsel: Boyut karşılaştırma -->
    <div style="color:var(--text2);font-size:12px;font-weight:600;margin-bottom:6px;margin-top:16px">BOYUT KARŞILAŞTIRMASI</div>
    <img class="comp-image" src="${step8Img}" onclick="showFull('${step8Img}')" style="margin-bottom:16px">

    <button class="btn btn-secondary" onclick="goScreen('moleDetail')">← Geri</button>
  `;
}

// ─── HELPERS ───
function goScreen(s) { state.screen = s; render(); }
function openMole(name) { state.currentMole = name; state.selectedRef = null; state.selectedTest = null; goScreen('moleDetail'); }
function viewCapture(ts) { state.lastTimestamp = ts; state.lastResult = { patch_count: 16 }; goScreen('results'); }

function showFull(url) {
  const div = document.createElement('div');
  div.className = 'fullscreen';
  div.innerHTML = `<img src="${url}">`;
  div.onclick = () => div.remove();
  document.body.appendChild(div);
}

async function deleteMole(name) {
  if (!confirm(`"${name}" ve tüm çekimleri silinecek. Emin misin?`)) return;
  try {
    const r = await fetch(API + `/moles/${name}`, { method: 'DELETE' });
    if (!r.ok) throw new Error(await r.text());
    goScreen('home');
  } catch(e) { alert('Silme hatası: ' + e.message); }
}

async function deleteCapture(ts) {
  if (!confirm(`Bu çekim silinecek. Emin misin?`)) return;
  try {
    const r = await fetch(API + `/moles/${state.currentMole}/${ts}`, { method: 'DELETE' });
    if (!r.ok) throw new Error(await r.text());
    goScreen('moleDetail');
  } catch(e) { alert('Silme hatası: ' + e.message); }
}

async function rejectCapture() {
  if (!confirm('Bu çekim silinecek. Emin misin?')) return;
  try {
    await fetch(API + `/moles/${state.currentMole}/${state.lastTimestamp}`, { method: 'DELETE' });
  } catch(e) {}
  goScreen('camera');
}

async function renameMole() {
  const newName = prompt('Yeni ben adı:', state.currentMole);
  if (!newName || newName === state.currentMole) return;
  try {
    const fd = new FormData();
    fd.append('new_name', newName);
    const r = await fetch(API + `/moles/${state.currentMole}`, { method: 'PUT', body: fd });
    if (!r.ok) throw new Error((await r.json()).detail || 'Hata');
    state.currentMole = newName;
    goScreen('moleDetail');
  } catch(e) { alert('Yeniden adlandırma hatası: ' + e.message); }
}

// ─── INIT ───
render();
</script>
</body>
</html>
